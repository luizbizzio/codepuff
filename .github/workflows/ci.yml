name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        run: npm test
      - name: Generated files are up to date
        shell: bash
        run: |
          node scripts/gen-codex-hooks.mjs
          git diff --exit-code codex/hooks.json
      - name: Mod checks (only where the claude CLI is installed)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . && claude plugin test .
          else
            echo "The claude CLI is not available on this runner: validate and the mod tests were skipped (run npm run check:mod locally)."
          fi
